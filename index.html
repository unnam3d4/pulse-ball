<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Pulse Ball: Побег</title>
<style>
:root{color-scheme:light;--ink:#273248;--accent:#7358e8;--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#111a2e;color:var(--ink);font-family:Segoe UI,Arial,sans-serif}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}

.wrap{width:100vw;height:100vh;height:100dvh;margin:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);overflow:hidden}
.game-shell{position:relative;width:100%;height:100%;min-height:0;max-width:none;margin:0;display:flex;flex-direction:column;overflow:hidden;border:0;border-radius:0;background:#fff;box-shadow:none}
.level-bar{position:relative;z-index:4;flex:0 0 53px;min-width:0;padding:0 18px;display:flex;align-items:stretch;justify-content:space-between;background:#fbfcffff;border-bottom:1px solid #e6e9f1;backdrop-filter:blur(16px)}
.levels{display:flex;min-width:0;height:100%;gap:25px}
.level-tab{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;color:#9aa2b1;font-size:12px;font-weight:600;padding:3px 0 0;display:flex;gap:9px;align-items:center;white-space:nowrap}

.level-tab.active,.level-tab:hover{color:#4656aa}
.level-tab.active{border-bottom-color:#8068ee}
.level-label{flex:none;align-items:center;display:flex;gap:7px;padding-left:8px;color:#8a91a3;font-size:9px;letter-spacing:1px}
.level-label svg{width:15px;height:15px}
.stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;width:100%;isolation:isolate;overflow:hidden;background:#e4efd9;touch-action:none}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
.hud{position:absolute;left:calc(16px + var(--safe-left));right:calc(16px + var(--safe-right));top:calc(16px + var(--safe-top));z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}

.hearts{padding:0 11px 2px 13px;color:#796be3;font-size:19px;letter-spacing:2px}
.empty-heart{color:#d9dfe6}

.time{min-width:65px;color:#748197;font-size:12px}
.pulse-meter{position:relative;min-width:92px;overflow:hidden;color:#187eab}.pulse-meter::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#d8e5ea}.pulse-meter i{position:absolute;z-index:1;left:0;bottom:0;height:4px;width:100%;background:#31cce7;transition:width .08s linear}.pulse-meter.cooling{color:#8aa2af}
.icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;padding:0;pointer-events:auto;border:1px solid #ffffffd0;border-radius:10px;background:#fffffff0;color:#566485;box-shadow:0 3px 10px #27355012}
.icon-btn:hover{transform:translateY(-1px);background:#fff}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sound-icon{width:16px;height:16px}
.help-control{color:#6555c8;font-size:16px;font-weight:800}
.ready-hint{position:absolute;z-index:2;bottom:calc(23px + var(--safe-bottom));left:50%;display:flex;align-items:center;gap:13px;padding:10px 18px;transform:translateX(-50%);border:1px solid #fff;border-radius:50px;background:#fffffff0;box-shadow:0 5px 25px #2634511a;white-space:nowrap}
.ready-hint[hidden],.overlay[hidden]{display:none}
.ready-hint p{margin:0;color:#566985;font-size:12px;font-weight:600}
.start-btn{padding:11px 21px;border:0;border-radius:24px;background:var(--accent);box-shadow:0 3px 0 #5942c6;color:#fff;font-size:12px;font-weight:750}
.start-btn:hover{transform:translateY(-1px);background:#6247d5}
.start-btn:active{transform:translateY(1px);box-shadow:none}
.toast{position:absolute;z-index:3;top:calc(69px + var(--safe-top));left:50%;padding:10px 18px;transform:translate(-50%,-10px);border-radius:30px;background:#fffffff2;color:#53647d;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.visible{transform:translate(-50%,0);opacity:1}
.tutorial{position:absolute;z-index:3;top:44%;left:50%;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:246px;max-width:calc(100% - 32px);padding:19px 26px 20px;transform:translate(-50%,calc(-50% + 9px)) scale(.97);border:1px solid #b5e8ef70;border-radius:23px;background:radial-gradient(ellipse at 50% 0,#275c7180,transparent 75%),linear-gradient(145deg,#142b43f5,#0b1b30f5);box-shadow:0 18px 40px #09283b35,0 3px 7px #03132030,inset 0 1px #eeffff36;backdrop-filter:blur(16px);color:#e4fbff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
.tutorial::before{content:"";position:absolute;top:0;left:23%;right:23%;height:2px;border-radius:50%;background:linear-gradient(90deg,transparent,#8be9f4,transparent)}
.tutorial.is-visible{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);transition:opacity .24s ease,transform .34s cubic-bezier(.16,1,.3,1),visibility 0s}
.tutorial[hidden]{display:none}.tutorial-progress{display:flex;align-items:center;gap:5px;height:4px}.tutorial-progress i{width:15px;height:3px;border-radius:3px;background:#66829a55}.tutorial-progress i.done{background:#739dae}.tutorial-progress i.current{width:26px;background:#86eafa;box-shadow:0 0 7px #86eafa40}
.tutorial-keys{display:flex;align-items:center;justify-content:center;gap:13px}.tutorial-key{display:inline-flex;align-items:center;justify-content:center;min-width:65px;height:59px;padding:0 17px;border:1px solid #e2ffff;border-bottom:4px solid #66aeba;border-radius:14px;background:linear-gradient(150deg,#f3feff,#c3eaf0);box-shadow:0 5px 0 #081c2ba0,0 7px 16px #061b2c30,inset 0 2px #fff;color:#153a54;font-size:26px;font-weight:800;line-height:1;text-shadow:0 1px #fff;transform:translateY(5px);transition:transform .32s cubic-bezier(.16,1,.3,1) .045s}.tutorial.is-visible .tutorial-key{transform:translateY(0)}.tutorial.is-visible .tutorial-key:nth-child(2){transition-delay:.09s}
.tutorial-label{font-size:12px;font-weight:750;letter-spacing:1.9px;text-align:center;white-space:nowrap;color:#c1dde7}.tutorial[data-cue="move"] .tutorial-key{min-width:76px;height:66px;font-size:43px;font-weight:900}.tutorial[data-cue="pulse"] .tutorial-desktop .tutorial-key,.tutorial[data-cue="object"] .tutorial-desktop .tutorial-key{font-size:32px}.tutorial-touch{display:none}

.overlay{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:15px max(13px,var(--safe-right)) 15px max(13px,var(--safe-left));background:#171d2e5c;backdrop-filter:blur(8px)}
.dialog{width:min(365px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:26px;border:1px solid #fff;border-radius:22px;background:#fafbff;box-shadow:0 18px 70px #17213b38;text-align:center;scrollbar-width:thin;scrollbar-color:#bdcbb0 transparent}
.dialog-symbol{margin-bottom:8px;color:#8470eb;font-size:39px;line-height:1.25}
.dialog h2{margin:10px 0;font-size:27px;letter-spacing:-.7px}
.dialog p{margin:0 0 20px;color:#7a8498;font-size:13px;line-height:1.7}
.dialog button{width:100%;margin-top:9px;padding:13px}
.dialog .secondary{border:1px solid #dce1ec;border-radius:25px;background:transparent;box-shadow:none;color:#65718b;font-size:12px;font-weight:600}
.help-list{display:grid;grid-template-columns:auto 1fr;gap:12px;margin:18px 0 22px;color:#71809a;font-size:12px;text-align:left}
.help-list strong{color:#46588f}
.result-stars{margin-bottom:6px;color:#e9b64a;font-size:36px;letter-spacing:8px}
.game-bottom{position:relative;z-index:3;flex:0 0 43px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 17px;border-top:1px solid #ebedf3;background:#ffffffed}
.controls-guide{display:flex;align-items:center;gap:20px;color:#8490a2;font-size:10px}
.key-group{display:flex;align-items:center;gap:5px}
kbd{min-width:22px;padding:3px 6px;border:1px solid #dfe3eb;border-bottom-width:2px;border-radius:5px;background:#fafbfc;color:#65728a;font-family:inherit;font-size:9px;text-align:center}
.key-group>span{margin-left:4px}
.level-progress{width:90px;height:4px;overflow:hidden;border-radius:4px;background:#eef0f5}
.level-progress i{display:block;width:0;height:100%;border-radius:4px;background:#8e7de4;transition:width .15s}
.progress-wrap{display:flex;align-items:center;gap:10px;color:#969eac;font-size:10px}
.touch-controls{position:absolute;z-index:3;right:calc(16px + var(--safe-right));bottom:calc(16px + var(--safe-bottom));left:calc(16px + var(--safe-left));display:none;justify-content:space-between;pointer-events:none}
.touch-group{display:flex;gap:10px}
.touch-btn{width:56px;height:54px;border:1px solid #ffffffb8;border-radius:17px;background:#ffffffe0;box-shadow:0 3px 0 #37457823;color:#485779;font-size:22px;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
.touch-btn.pressed{transform:translateY(2px);background:#e1ddff;box-shadow:none}
.touch-btn.jump{width:66px;background:#8067edeb;color:white}
.touch-btn.pulse{width:62px;background:#168bb6e8;color:#fff;font-size:13px;font-weight:800;letter-spacing:.3px}.touch-btn.pulse.cooling{background:#7c9ba7e0}
.game-shell:fullscreen{width:100vw;height:100vh;height:100dvh}
.game-shell:fullscreen .touch-controls{display:flex}
@media(pointer:coarse){.touch-controls{display:flex}.tutorial-desktop{display:none}.tutorial-touch{display:flex}}
@media(max-width:800px){.levels{gap:10px}.level-tab{font-size:10px;gap:5px}.level-label{display:flex;gap:4px;padding-left:5px;font-size:8px;letter-spacing:.6px}.level-label svg{width:13px;height:13px}.level-bar{padding-inline:9px}.controls-guide{gap:13px}.progress-wrap{display:none}.hud{top:calc(12px + var(--safe-top));right:calc(12px + var(--safe-right));left:calc(12px + var(--safe-left))}.hud-chip,.icon-btn{min-height:34px;height:34px}.icon-btn{width:34px}.hud-chip{padding:0 9px;font-size:11px}.hearts{padding-left:10px;font-size:17px;letter-spacing:1px}.time{display:none}.ready-hint{bottom:calc(80px + var(--safe-bottom));padding:9px 13px}.ready-hint p{font-size:10px}.start-btn{padding:10px 17px;font-size:11px}}
@media(max-width:600px){.level-bar{flex-basis:48px;padding:0 9px}.levels{flex:1;justify-content:flex-start;gap:clamp(6px,3vw,13px)}.level-tab{gap:5px;font-size:10px}.level-tab span{font-size:9px}.level-tab .level-name{display:none}.level-tab[data-level="0"]::after{content:"Первый импульс"}.level-label{gap:0;padding:0 2px;white-space:nowrap}.level-label svg{display:none}.level-label>span{font-size:0}.level-label>span::before{content:"Pulse Ball: Побег";font-size:9px;letter-spacing:.6px}.level-label #levelRecord{display:none}.hud{top:calc(9px + var(--safe-top));right:calc(7px + var(--safe-right));left:calc(7px + var(--safe-left));gap:4px}.hud-group,.hud-group:last-child{gap:4px}.hud-chip{min-height:32px;height:32px;gap:4px;padding:0 7px;border-radius:9px;font-size:10px}.hearts{padding:0 7px 1px;font-size:15px;letter-spacing:0}.star-icon{font-size:18px}.star-divider{margin:0}.pulse-meter{min-width:55px;padding:0 5px;font-size:9px}.icon-btn{width:27px;min-width:27px;height:31px;border-radius:8px}.icon-btn svg{width:15px;height:15px}.help-control{font-size:14px}.touch-controls{right:calc(12px + var(--safe-right));bottom:calc(12px + var(--safe-bottom));left:calc(12px + var(--safe-left))}.touch-group{gap:9px}.touch-btn{width:52px;height:51px;border-radius:15px}.touch-btn.jump{width:60px}.touch-btn.pulse{width:58px;font-size:11px}.ready-hint{bottom:calc(76px + var(--safe-bottom));gap:10px;padding:8px 10px}.ready-hint p{font-size:10px}.game-bottom{flex-basis:35px;padding-inline:8px}.controls-guide{gap:10px;font-size:9px}.controls-guide .desktop-only{display:none}kbd{min-width:19px;padding:2px 4px;font-size:9px}.dialog{width:min(300px,100%);padding:19px}.dialog h2{font-size:22px}.dialog p{margin-bottom:13px;font-size:12px}.dialog-symbol{margin:0;font-size:29px}.dialog button{padding:10px}.help-list{gap:9px;margin:12px 0;font-size:11px}.toast{top:calc(55px + var(--safe-top));font-size:10px}}
@media(max-width:350px){.level-tab{gap:3px;font-size:9px}.level-tab span{font-size:8px}.level-bar{padding-inline:6px}.hud-chip{padding-inline:5px}.hud-group,.hud-group:last-child{gap:3px}.hud-group:last-child{position:absolute;right:0;top:37px}.icon-btn{width:26px;min-width:26px}}
@media(max-width:600px){.tutorial{top:43%;min-width:224px;padding:17px 22px 18px;gap:14px}.tutorial-key{min-width:60px;height:55px;font-size:24px}.tutorial[data-cue="move"] .tutorial-key{min-width:70px;height:62px;font-size:40px}}
@media(max-width:600px){.level-tab[data-level="0"]::after{content:"Импульс"}.level-tab[data-level="1"]::after{content:"Эхо"}.level-tab[data-level="2"]::after{content:"Разлом"}}
@media(max-height:480px) and (orientation:landscape){.level-bar{flex-basis:40px}.game-bottom{flex-basis:31px}.ready-hint{bottom:9px;gap:8px;padding:5px 10px}.ready-hint p{font-size:9px}.ready-hint .start-btn{padding:7px 11px}.touch-controls{bottom:8px}.touch-btn{width:44px;height:44px}.touch-btn.jump{width:50px}.hud{top:6px}.game-bottom .controls-guide{font-size:8px}}
@media(max-height:480px) and (orientation:landscape){.tutorial{top:46%;min-width:210px;padding:12px 21px;gap:10px;border-radius:18px}.tutorial-key,.tutorial[data-cue="move"] .tutorial-key{height:46px;min-width:58px;font-size:29px}.tutorial-label{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
.levels{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:contain;gap:22px;scroll-behavior:smooth}.levels::-webkit-scrollbar{display:none}.level-tab{flex-shrink:0;min-height:44px}.level-label{flex-shrink:0}.levels.dragging{scroll-behavior:auto;cursor:grabbing}.level-tab .level-name{font-size:12px;opacity:1}
@media(max-width:1050px){.level-label{display:none}.levels{gap:22px}.level-tab{font-size:12px}.level-tab span{font-size:10px}}
@media(max-width:600px){.levels{gap:22px;justify-content:flex-start}.level-tab .level-name{display:inline;font-size:11px}.level-tab[data-level]::after{content:none}.level-tab{font-size:11px;gap:6px}.level-tab span{font-size:10px}}

<body>
<div class="wrap">
  <main class="game-shell" id="game-shell" aria-label="Pulse Ball: Побег — игра">
    <nav class="level-bar" aria-label="Выбор уровня">
      <div class="levels">
        <button class="level-tab active" data-level="0" aria-current="true"><span>01</span><span class="level-name"> Первый импульс</span></button>
        <button class="level-tab" data-level="1"><span>02</span><span class="level-name"> Эхо долины</span></button>
        <button class="level-tab" data-level="2"><span>03</span><span class="level-name"> Энергетический разлом</span></button>
        <button class="level-tab" data-level="3"><span>04</span><span class="level-name"> Импульсный подъём</span></button>
        <button class="level-tab" data-level="4"><span>05</span><span class="level-name"> Небесные террасы</span></button>
        <button class="level-tab" data-level="5"><span>06</span><span class="level-name"> Сердце разлома</span></button>
        <button class="level-tab" data-level="6"><span>07</span><span class="level-name"> Резонансный каньон</span></button>
        <button class="level-tab" data-level="7"><span>08</span><span class="level-name"> Над облаками</span></button>
        <button class="level-tab" data-level="8"><span>09</span><span class="level-name"> Каскад энергии</span></button>
      </div>
      <div class="level-label"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4"/><path d="M15.7 4.3 13 7"/></svg><span>Pulse Ball: Побег · <span id="levelRecord">ТВОЙ РЕКОРД</span></span></div>
    </nav>
    <div class="stage" id="stage">
      <canvas id="game" tabindex="0" aria-label="Игра. Стрелки или A и D — движение, пробел — прыжок, E — импульс, P — пауза, R — заново."></canvas>
      <div class="hud">
        <div class="hud-group"><div class="hud-chip hearts" id="hearts" aria-label="3 жизни">♥♥♥</div><div class="hud-chip" aria-label="Собранные звёзды"><span class="star-icon">★</span><span id="starCount">0</span><span class="star-divider">/</span><span id="starTotal">15</span></div><div class="hud-chip pulse-meter" id="pulseMeter" aria-label="Импульс готов"><span id="pulseText">PULSE</span><i id="pulseFill"></i></div><div class="hud-chip time" id="timer">00:00</div></div>
        <div class="hud-group"><button class="icon-btn help-control" id="helpButton" title="Как играть" aria-label="Как играть">?</button><button class="icon-btn" id="soundButton" aria-label="Включить звук" aria-pressed="false"><svg class="sound-icon" viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path id="soundWaves" d="m16 9 6 6m0-6-6 6"/></svg></button><button class="icon-btn" id="restartButton" title="Начать заново (R)" aria-label="Начать заново"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.5 8M4 4v6h6"/></svg></button><button class="icon-btn" id="pauseButton" title="Пауза (P)" aria-label="Пауза"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button class="icon-btn fullscreen-btn" id="fullscreenButton" title="На весь экран" aria-label="На весь экран"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
      </div>

<script id="engine">
'use strict';
globalThis.PulseBallEngine = (() => {
  const levels = [
    {name:'Первый импульс',width:8150,

      else if(e.type==='stomp'){burst(e.x,e.y,'#5a6d54',16);tone(170,.15,'triangle');}
      else if(e.type==='hurt'){burst(e.x,e.y,'#f08064',15);shake=6;tone(130,.2,'sawtooth',0,.018);if(g.health>0)toast(g.checkpoint.active?'Ещё попытка — с контрольной точки!':'Ничего, попробуем ещё раз!');}
      else if(e.type==='checkpoint'){toast('Контрольная точка! Здесь безопасно.');burst(e.x,e.y,'#c3d989',16,true);tone(660,.15);tone(880,.15,'sine',.1);}
      else if(e.type==='pulse'){tone(420,.12,'sawtooth',0,.02);tone(670,.13,'sine',.06,.025);}
      else if(e.type==='shatter'){burst(e.x,e.y,'#8befff',15);toast('Блок разрушен!');}
      else if(e.type==='push'){burst(e.x,e.y,'#62e8ff',7);}
      else if(e.type==='switch'){toast('Переключатель включён. Направь ящик на плиту!');tone(740,.17);}
      else if(e.type==='bridge'){toast('Мост активирован!');burst(e.x,e.y,'#77ecf5',18);tone(830,.2);}
      else if(e.type==='win'){for(let i=0;i<8;i++)burst(e.x-160+i*45,230,'#f6cb67',12,true);[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',i*.1));}
    }
  }
  function formatTime(seconds){const n=Math.floor(seconds);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
  function updateHud(){
    $('hearts').innerHTML='♥'.repeat(g.health)+'<span class="empty-heart">'+'♥'.repeat(3-g.health)+'</span>';$('hearts').setAttribute('aria-label',g.health+' жизни');
    $('starCount').textContent=g.collected;$('starTotal').textContent=g.stars.length;$('timer').textContent=formatTime(g.time);
    const charge=1-g.pulseCooldown/.85;$('pulseFill').style.width=Math.round(charge*100)+'%';$('pulseMeter').classList.toggle('cooling',charge<1);$('pulseText').textContent=charge>=1?'PULSE':Math.ceil(g.pulseCooldown*10)/10+'с';$('pulseMeter').setAttribute('aria-label',charge>=1?'Импульс готов':'Импульс заряжается');$('pulseButton').classList.toggle('cooling',charge<1);
    const progress=Math.round(Math.max(0,Math.min(1,(g.player.x-150)/(g.finish.x-150)))*100);$('progressBar').style.width=progress+'%';$('progressText').textContent=progress+'%';
  }
  function updateRecord(){const r=best[g.index];$('levelRecord').textContent=r&&r.level===g.level.name&&Number.isFinite(r.stars)?'РЕКОРД: '+r.stars+' / '+g.stars.length+' ★':'ТВОЁ ПРИКЛЮЧЕНИЕ';}
  function clearInput(){heldCodes.clear();touchPointers.clear();pulseQueued=false;input={left:false,right:false,jump:false,pulse:false};g.pulseHeld=false;document.querySelectorAll('.touch-btn').forEach(b=>b.classList.remove('pressed'));}
  function start(){mode='playing';$('readyHint').hidden=true;$('overlay').hidden=true;unlockAudio();canvas.focus({preventScroll:true});}
  function loadLevel(index,autostart=false){
    clearInput();g=E.createGame(index);mode=autostart?'playing':'ready';camera=0;particles=[];shake=0;accumulator=0;tutorialSeen=new Set();hideTutorial(true);
    $('overlay').hidden=true;$('readyHint').hidden=autostart;$('toast').classList.remove('visible');
    document.querySelectorAll('[data-level]').forEach(b=>{const active=Number(b.dataset.level)===index;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
    document.querySelector('[data-level="'+index+'"]').scrollIntoView({block:'nearest',inline:'nearest'});
    updateHud();updateRecord();if(autostart){unlockAudio();canvas.focus({preventScroll:true});}
  }
  function openDialog(kind){
    clearInput();hideTutorial(true);dialogKind=kind;mode=kind;$('readyHint').hidden=true;$('overlay').hidden=false;$('dialogExtra').innerHTML='';$('dialogSecondary').hidden=false;
    if(kind==='paused'){$('dialogSymbol').textContent='Ⅱ';$('dialogTitle').textContent='Маленькая передышка';$('dialogText').textContent='Импульс подождёт. Продолжим, когда будешь готов.';$('dialogPrimary').textContent='Продолжить →';$('dialogSecondary').textContent='С начала уровня';}
    if(kind==='help'){$('dialogSymbol').textContent='↟';$('dialogTitle').textContent='Как играть';$('dialogText').textContent='Используй Pulse, чтобы открыть путь к финишу.';$('dialogExtra').innerHTML='<div class="help-list"><strong>← → или A D</strong><span>Движение</span><strong>↑ W или пробел</strong><span>Прыжок</span><strong>E</strong><span>Импульс перед героем: ломает голубые блоки, двигает ящик и включает переключатель. На телефоне — кнопка PULSE</span><strong>Плита</strong><span>Поставь на неё импульсный ящик, чтобы включить мост</span><strong>Белый флаг</strong><span>Контрольная точка</span><strong>P / R</strong><span>Пауза / начать заново</span></div>';$('dialogPrimary').textContent='Всё понятно →';$('dialogSecondary').hidden=true;}
    if(kind==='lost'){$('dialogSymbol').textContent='↻';$('dialogTitle').textContent='Ещё один разбег?';$('dialogText').textContent='Каждый прыжок — немного опыта. В этот раз точно получится.';$('dialogPrimary').textContent='Попробовать снова →';$('dialogSecondary').textContent='К началу приключения';}
    if(kind==='won'){
      const all=g.collected===g.stars.length,rating=all?3:g.collected>=g.stars.length/2?2:1;
      $('dialogSymbol').textContent='';$('dialogTitle').textContent=g.level.name+' пройден!';$('dialogText').textContent='Собрано '+g.collected+' из '+g.stars.length+' звёзд за '+formatTime(g.time)+'. '+(all?'Все звёзды твои!':'Ещё есть что исследовать.');
      $('dialogExtra').innerHTML='<div class="result-stars">'+'★'.repeat(rating)+'<span style="color:#dfe4d2">'+'★'.repeat(3-rating)+'</span></div>';
      $('dialogPrimary').textContent=g.index<E.levels.length-1?'Следующий уровень →':'Сыграть ещё раз →';$('dialogSecondary').textContent='Переиграть этот уровень';
      const prev=best[g.index],old=prev?.level===g.level.name?prev:null;
      const stars=Math.max(g.collected,Number.isFinite(old?.stars)?old.stars:0),time=Math.min(g.time,Number.isFinite(old?.time)?old.time:Infinity);
      if(!old||stars!==old.stars||time!==old.time){best[g.index]={level:g.level.name,stars,time};try{localStorage.setItem('pulse-ball-save-v1',JSON.stringify(best));}catch{}updateRecord();}
    }
    $('dialogPrimary').focus({preventScroll:true});
  }
  function pause(){if(mode==='playing')openDialog('paused');else if(mode==='paused')start();}
  function updateSound(){ $('soundButton').setAttribute('aria-label',sound?'Выключить звук':'Включить звук');$('soundButton').setAttribute('aria-pressed',String(sound));$('soundWaves').setAttribute('d',sound?'M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14':'m16 9 6 6m0-6-6 6');}
  $('startButton').onclick=start;$('restartButton').onclick=()=>loadLevel(g.index,true);$('pauseButton').onclick=pause;
  $('helpButton').onclick=()=>{if(mode==='help')return;helpPrevious=mode;openDialog('help');};
  $('soundButton').onclick=()=>{sound=!sound;updateSound();unlockAudio();if(sound)tone(660,.1);};
  function updateFullscreen(){const active=document.fullscreenElement===$('game-shell');$('fullscreenButton').setAttribute('aria-label',active?'Выйти из полноэкранного режима':'На весь экран');$('fullscreenButton').title=active?'Выйти из полноэкранного режима':'На весь экран';}
  document.addEventListener('fullscreenchange',updateFullscreen);
  $('fullscreenButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('game-shell').requestFullscreen();}catch{toast('Полный экран недоступен в этом окне');}};
  $('dialogPrimary').onclick=()=>{
    if(dialogKind==='paused')start();
    else if(dialogKind==='help'){if(helpPrevious==='ready'){mode='ready';$('overlay').hidden=true;$('readyHint').hidden=false;canvas.focus({preventScroll:true});}else if(helpPrevious==='playing')start();else openDialog(helpPrevious);}
    else if(dialogKind==='lost')loadLevel(g.index,true);
    else if(dialogKind==='won')loadLevel((g.index+1)%E.levels.length,true);
  };
  $('dialogSecondary').onclick=()=>loadLevel(dialogKind==='lost'?0:g.index,dialogKind!=='lost');
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>loadLevel(Number(b.dataset.level)));
  const levelStrip=document.querySelector('.levels');let levelDrag=null,levelDragged=false;
  levelStrip.addEventListener('pointerdown',e=>{levelDrag={id:e.pointerId,x:e.clientX,left:levelStrip.scrollLeft};levelDragged=false;});
  levelStrip.addEventListener('pointermove',e=>{if(!levelDrag||e.pointerId!==levelDrag.id)return;const dx=e.clientX-levelDrag.x;if(Math.abs(dx)>6){levelDragged=true;levelStrip.classList.add('dragging');levelStrip.setPointerCapture(e.pointerId);}if(levelDragged){e.preventDefault();levelStrip.scrollLeft=levelDrag.left-dx;}});
  const endLevelDrag=e=>{if(e.type==='pointerup'&&e.pointerType==='touch'&&!levelDragged){const tab=e.target.closest('[data-level]');if(tab){loadLevel(Number(tab.dataset.level));levelDragged=true;}}levelDrag=null;levelStrip.classList.remove('dragging');};
  levelStrip.addEventListener('pointerup',endLevelDrag);levelStrip.addEventListener('pointercancel',endLevelDrag);
  levelStrip.addEventListener('click',e=>{if(levelDragged){e.preventDefault();e.stopImmediatePropagation();levelDragged=false;}},true);
  const codeMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyE:'pulse'};
  function syncInput(){for(const key of ['left','right','jump','pulse'])input[key]=[...heldCodes].some(c=>codeMap[c]===key)||[...touchPointers.values()].some(v=>v===key);}
  addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.code==='Tab'&&!$('overlay').hidden){const buttons=[...$('dialog').querySelectorAll('button')].filter(b=>!b.hidden);if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}return;}
    if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat){if(mode==='help')$('dialogPrimary').click();else pause();}e.preventDefault();return;}
    if(e.code==='KeyR'&&!e.repeat&&mode!=='help'){e.preventDefault();loadLevel(g.index,true);return;}
    if(codeMap[e.code]&&(mode==='playing'||mode==='ready')){
      if(e.code==='Space'&&e.target.tagName==='BUTTON'&&e.target!==$('startButton'))return;
      e.preventDefault();if(mode==='ready')start();if(codeMap[e.code]==='pulse'&&!heldCodes.has(e.code))pulseQueued=true;heldCodes.add(e.code);syncInput();unlockAudio();
    }
  });
  addEventListener('keyup',e=>{if(codeMap[e.code]){heldCodes.delete(e.code);syncInput();if(mode==='playing')e.preventDefault();}});
  document.querySelectorAll('.touch-btn').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='ready')start();if(mode!=='playing')return;b.setPointerCapture(e.pointerId);touchPointers.set(e.pointerId,b.dataset.key);if(b.dataset.key==='pulse')pulseQueued=true;syncInput();b.classList.add('pressed');unlockAudio();});
    function release(e){touchPointers.delete(e.pointerId);syncInput();if(![...touchPointers.values()].includes(b.dataset.key))b.classList.remove('pressed');}
    b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release);
  });
  stage.addEventListener('contextmenu',e=>e.preventDefault());stage.addEventListener('selectstart',e=>e.preventDefault());
  addEventListener('blur',()=>{clearInput();if(mode==='playing')openDialog('paused');});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(mode==='playing')openDialog('paused');}});
  function frame(now){
    const dt=Math.min(.05,Math.max(0,(now-last)/1000||0));last=now;visualTime+=dt;
    if(mode==='playing'){
      accumulator+=dt;while(accumulator>=1/120){E.step(g,pulseQueued?{...input,pulse:true}:input,1/120);pulseQueued=false;handleEvents();accumulator-=1/120;if(g.status!=='playing'){openDialog(g.status);accumulator=0;break;}}
    }else accumulator=0;
    const target=Math.max(0,Math.min(g.level.width-viewW,g.player.x-viewW*.32));
    camera+=(target-camera)*(1-Math.exp(-dt*7));if(Math.abs(camera-target)<.05)camera=target;
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt*23);
    if(visualTime>toastUntil)$('toast').classList.remove('visible');
    updateTutorial();draw();updateHud();requestAnimationFrame(frame);
  }
  updateRecord();updateHud();requestAnimationFrame(frame);
})();
</script>

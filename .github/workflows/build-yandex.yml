name: Build Yandex release

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "audio/**"
      - "scripts/build-yandex.mjs"
      - "package.json"
      - ".github/workflows/build-yandex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Yandex package
        run: npm run build:yandex

      - name: Show package layout
        run: |
          find dist -type f -printf "%p %s bytes\n" | sort
          du -sh dist

      - name: Upload Yandex archive
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ball-yandex
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

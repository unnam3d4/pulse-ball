name: Yandex Games Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser for release checks
        run: npx playwright install --with-deps chromium

      - name: Test gameplay runtime
        run: npm run test:runtime

      - name: Test player visuals
        run: npm run test:player

      - name: Build and validate Yandex package
        run: npm run build:yandex

      - name: Show package layout
        run: |
          find dist -type f -printf "%p %s bytes\n" | sort
          du -sh dist

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ball-yandex
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
